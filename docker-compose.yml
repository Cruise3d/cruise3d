# docker-compose.yml — unified stack for Cruise3D.
#
# Usage:
#   docker compose up --build            # postgres + api + frontend (nginx prod on :8080)
#   docker compose --profile dev up      # also starts vite HMR frontend on :5173
#   docker compose down -v               # stop & drop the postgres volume
#
# Secrets come from the repo-root .env file (gitignored). See .env.example
# for the keys this file expects.

name: cruise3d

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      TZ: UTC
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: ["postgres", "-c", "timezone=UTC", "-c", "log_timezone=UTC"]
    volumes:
      - ./cruise3d-api/docker/postgres-init:/docker-entrypoint-initdb.d:ro
      - postgres_data:/var/lib/postgresql/data
    # Bind port 5432 strictly to localhost (127.0.0.1) so Postgres is NOT exposed to the public internet.
    # The API service connects to Postgres internally via the Docker bridge network ('postgres:5432').
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h localhost || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build:
      context: ./cruise3d-api/cruise3d
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      TZ: UTC
      # Default to Development locally, but allow servers to override this to Production.
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-cruise3d};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres123}"
      # Use the public site URL for web-push click-throughs. Override per environment.
      App__PublicUrl: ${APP_PUBLIC_URL:-https://localhost}
      Razorpay__Key: ${RAZORPAY_KEY}
      Razorpay__Secret: ${RAZORPAY_SECRET}
      Firebase__CredentialsPath: ${FIREBASE_CREDENTIALS_PATH:-/app/secrets/firebase-adminsdk.json}
    volumes:
      - ./secrets:/app/secrets:ro
    ports:
      - "5001:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./cruise3d-clientside
      target: prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_RAZORPAY_KEY_ID: ${VITE_RAZORPAY_KEY_ID}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
        VITE_FIREBASE_VAPID_KEY: ${VITE_FIREBASE_VAPID_KEY}
    image: cruise3d-frontend:prod
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - api

  frontend-dev:
    profiles: ["dev"]
    build:
      context: ./cruise3d-clientside
      target: dev
      args:
        VITE_API_BASE_URL: http://localhost:5001/api
        VITE_RAZORPAY_KEY_ID: ${VITE_RAZORPAY_KEY_ID}
    image: cruise3d-frontend:dev
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:5001/api
      VITE_RAZORPAY_KEY_ID: ${VITE_RAZORPAY_KEY_ID}
      VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
      VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
      VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
      VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID}
      VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
      VITE_FIREBASE_VAPID_KEY: ${VITE_FIREBASE_VAPID_KEY}
    volumes:
      # Bind-mount source for HMR. The anonymous /app/node_modules
      # volume keeps the in-container node_modules (avoiding Windows
      # arch/permission mismatches).
      - ./cruise3d-clientside:/app
      - /app/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    depends_on:
      api:
        condition: service_started
        required: false

volumes:
  postgres_data:
