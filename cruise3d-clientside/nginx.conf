server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip for common text assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Long-cache hashed assets emitted by Vite under /assets/
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: any unmatched path falls back to index.html so React Router
    # can handle the route. Don't override this for /api — the dev server is
    # responsible for proxying in development; production API URL is configured
    # via VITE_API_BASE_URL at build time.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Sensible security headers for a static SPA.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
